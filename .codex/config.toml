# - https://developers.openai.com/codex/config-reference/
# - https://developers.openai.com/codex/config-sample/

################################################################################
# Security
################################################################################

# Safest:
web_search = "disabled" # "cached"
# approval_policy = "untrusted" # untrusted < on-request < on-failure
sandbox_mode = "read-only" # "workspace-write"
model = "gpt-6-astra"

# Defaults:
# web_search = "cached"
# approval_policy = "on-request"
# sandbox_mode = "workspace-write"

notify = ["/Users/status/.codex/computer-use/Codex Computer Use.app/Contents/SharedSupport/SkyComputerUseClient.app/Contents/MacOS/SkyComputerUseClient", "turn-ended"]
personality = "pragmatic"
model_reasoning_effort = "low"

[sandbox_workspace_write]
exclude_tmpdir_env_var = true  # $TMPDIR
exclude_slash_tmp = true       # /tmp
# writable_roots = ["/Users/YOU/.pyenv/shims"]
network_access = false

[shell_environment_policy]
inherit = "none" # all, core
ignore_default_excludes = true

[shell_environment_policy.set]
NODE_REPL_TRUSTED_BROWSER_CLIENT_SHA256S = "9230e2bd8b24b7ac7a0ba6774c64bf0d78ecdabbdd91d0ed627b02a587bae2df"
# exclude = ["AWS_*", "AZURE_*"]
# set = { PATH = "/usr/bin", MY_FLAG = "1" }
# include_only = ["PATH", "HOME"]

[history]
persistence = "save-all" # none

[analytics]
enabled = false

################################################################################
# Model
################################################################################

model = "gpt-5.3-codex"
model_reasoning_effort = "high"
model_reasoning_summary = "auto"
model_verbosity = "medium"
model_supports_reasoning_summaries = false
# model_context_window = 128000
personality = "pragmatic"

# oss_provider = "ollama" # or "lmstudio"
# [model_providers.ollama]
# name = "Ollama"
# base_url = "http://localhost:11434/v1"
# wire_api = "chat"

################################################################################
# Notifications
################################################################################

# notify = [
#   "bash",
#   "-lc",
#   "osascript -e 'display notification \"Task finished!\" with title \"Codex\"'; afplay /System/Library/Sounds/Glass.aiff; say -v 'Daniel' 'Finished!';",
# ]
# notify = ["osascript", "-e", "on run argv\n display notification (item 1 of argv) with title \"Codex\"\n end run"]

################################################################################
# TUI
################################################################################

[tui]
notifications = true
notification_method = "auto"
animations = true
show_tooltips = false
alternate_screen = "always" # auto, always, never

check_for_update_on_startup = false

[notice.model_migrations]
"gpt-5.2-codex" = "gpt-5.3-codex"
"gpt-5.3-codex" = "gpt-5.4"

[projects."/Users/status/work/yanarullo.github.io"]
trust_level = "trusted"

[desktop]
followUpQueueMode = "queue"
dock-icon-preference = "app-default"
conversationDetailMode = "STEPS_PROSE"
open-link-in-target-preference = "external-browser"
sansFontSize = 14
mac-menu-bar-enabled = false
hotkey-window-projectless-default-enabled = true
appearanceLightCodeThemeId = "github"
realtimeVoiceScreenContextEnabled = false
open-local-url-in-target-preference = "external-browser"
codeFontSize = 13
ambient-suggestions-enabled = false
enabled-reasoning-efforts = ["low", "medium", "high", "xhigh", "ultra", "persistent", "max"]

[desktop.open-in-target-preferences]
global = "fileManager"

[desktop.open-in-target-preferences.perPath]
"/Users/status/Documents/New project" = "fileManager"

[desktop.appearanceLightChromeTheme]
accent = "#0969da"
contrast = 40
ink = "#1f2328"
opaqueWindows = false
surface = "#ffffff"

[desktop.appearanceLightChromeTheme.fonts]

[desktop.appearanceLightChromeTheme.semanticColors]
diffAdded = "#1a7f37"
diffRemoved = "#cf222e"
skill = "#8250df"

[marketplaces.openai-bundled]
source_type = "local"
source = "/Users/status/.codex/.tmp/bundled-marketplaces/openai-bundled"

[marketplaces.openai-primary-runtime]
last_updated = "2026-08-10T13:03:55Z"
source_type = "local"
source = "/Users/status/.cache/codex-runtimes/codex-primary-runtime/plugins/openai-primary-runtime"

[plugins."browser@openai-bundled"]
enabled = true

[plugins."visualize@openai-bundled"]
enabled = true

[plugins."documents@openai-primary-runtime"]
